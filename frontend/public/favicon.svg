<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Brain circuit icon (simplified BrainCircuit from lucide) -->
  <!-- Left brain lobe -->
  <path d="M10 20 C7 20 5 18 5 15.5 C5 13.5 6.2 11.8 8 11.2 C8 11.1 8 11 8 10.9 C8 8.7 9.8 7 12 7 C12.7 7 13.4 7.2 14 7.5"
        stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- Right brain lobe -->
  <path d="M18 7.5 C18.6 7.2 19.3 7 20 7 C22.2 7 24 8.7 24 10.9 C24 11 24 11.1 24 11.2 C25.8 11.8 27 13.5 27 15.5 C27 18 25 20 22 20"
        stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- Center divider -->
  <line x1="16" y1="7" x2="16" y2="20" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Circuit lines -->
  <line x1="10" y1="20" x2="10" y2="24" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="10" y1="24" x2="14" y2="24" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22" y1="20" x2="22" y2="24" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22" y1="24" x2="18" y2="24" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="16" y2="24" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Circuit dots -->
  <circle cx="14" cy="24" r="1.2" fill="white"/>
  <circle cx="18" cy="24" r="1.2" fill="white"/>
  <circle cx="16" cy="12" r="1.2" fill="white"/>
</svg>
